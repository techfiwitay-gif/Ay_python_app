name: Journal Publisher Manual Check

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish after review (otherwise dry run only). OpenAI API secret required for this optional runner.'
        type: boolean
        default: false

permissions:
  contents: write

# The authoritative Friday schedule runs OpenClaw on the owner's WSL host.
# Do not schedule a second independent publisher on GitHub.
concurrency:
  group: journal-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AUTO_POST_EDITORIAL_BACKEND: 'openai'
      AUTO_POST_OPENAI_MODEL: ${{ vars.AUTO_POST_OPENAI_MODEL || 'gpt-6-luna' }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      AUTO_POST_TOPIC: ${{ vars.AUTO_POST_TOPIC || 'AI tech news' }}
      AUTO_POST_AUDIENCE: ${{ vars.AUTO_POST_AUDIENCE || 'founders' }}
      AUTO_POST_ANGLE: ${{ vars.AUTO_POST_ANGLE || 'Keep the article tightly tied to a recent AI-heavy tech news topic, make the title distinct from prior posts, and focus on practical implications for builders, founders, and operators.' }}
      AUTO_POST_IMAGE_URL: ${{ vars.AUTO_POST_IMAGE_URL }}
      AUTO_POST_AUTHOR_EMAIL: ${{ vars.AUTO_POST_AUTHOR_EMAIL }}
      AUTO_POST_USE_REAL_EVENTS: ${{ vars.AUTO_POST_USE_REAL_EVENTS || 'true' }}
      AUTO_POST_EVENT_QUERY: ${{ vars.AUTO_POST_EVENT_QUERY || 'artificial intelligence OR AI OR OpenAI OR Anthropic OR Google DeepMind OR Microsoft AI OR Nvidia OR robotics OR chips OR developer tools OR cloud software' }}
      AUTO_POST_EVENT_HOURS: ${{ vars.AUTO_POST_EVENT_HOURS || '168' }}
      AUTO_POST_FALLBACK_EVENT_HOURS: ${{ vars.AUTO_POST_FALLBACK_EVENT_HOURS || '336' }}
      AUTO_POST_EVENT_LIMIT: ${{ vars.AUTO_POST_EVENT_LIMIT || '12' }}
      AUTO_POST_RESEARCH_EVENTS: ${{ vars.AUTO_POST_RESEARCH_EVENTS || 'true' }}
      AUTO_POST_RESEARCH_LIMIT: ${{ vars.AUTO_POST_RESEARCH_LIMIT || '4' }}
      AUTO_POST_REQUIRE_CREDIBLE_EVENT: ${{ vars.AUTO_POST_REQUIRE_CREDIBLE_EVENT || 'true' }}
      AUTO_POST_ENFORCE_QUALITY: ${{ vars.AUTO_POST_ENFORCE_QUALITY || 'true' }}
      AUTO_POST_MODE: ${{ vars.AUTO_POST_MODE || 'skip' }}
      AUTO_POST_USE_GENERATOR_COMMAND: "false"
      AUTO_POST_DYNAMIC_TOPIC: "true"
      AUTO_POST_REQUIRE_GENERATOR: "true"
      AUTO_POST_USE_IMAGE_GENERATION: "false"
      GIT_AUTHOR_NAME: AyNcode Bot
      GIT_AUTHOR_EMAIL: ayncode-bot@example.com
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Review without publishing
        if: ${{ !inputs.publish }}
        run: python scripts/auto_publish.py --dry-run

      - name: Generate and publish reviewed article
        if: ${{ inputs.publish }}
        run: python scripts/auto_publish.py --commit --push
